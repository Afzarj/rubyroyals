<!-- Tamil Keyboard Modal -->
<div class="modal fade" id="tamilKeyboardModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">தமிழ் விசைப்பலகை (Tamil Keyboard)</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="keyboard d-flex flex-wrap gap-2">
          <!-- Uyir (vowels) -->
          <button type="button" class="btn btn-outline-secondary tamil-key">அ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">ஆ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">இ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">ஈ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">உ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">ஊ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">எ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">ஏ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">ஐ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">ஒ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">ஓ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">ஔ</button>

          <!-- Example Uyirmei (க series) -->
          <button type="button" class="btn btn-outline-secondary tamil-key">க</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">கா</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">கி</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">கீ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">கு</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">கூ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">கெ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">கே</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">கை</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">கொ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">கோ</button>
          <button type="button" class="btn btn-outline-secondary tamil-key">கௌ</button>

          <!-- Repeat similar blocks for other consonants (ங, ச, ஞ, ட, etc.) -->
        </div>
      </div>
    </div>
  </div>
</div>
<div class="form-check mb-3">
  <input class="form-check-input" type="checkbox" id="toggleTamilKeyboard">
  <label class="form-check-label" for="toggleTamilKeyboard">
    Enable Tamil Keyboard
  </label>
  <button type="button" class="btn btn-sm btn-primary ms-2" id="openTamilKeyboard" style="display:none;" data-bs-toggle="modal" data-bs-target="#tamilKeyboardModal">
    Open Keyboard
  </button>
</div>




{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h4 class="card-title mb-3">Pledge Form</h4>
    <form id="pledgeForm" method="post" action="{{ url_for('submit') }}" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Name <span class="text-danger">*</span></label>
          <input name="name" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Gender <span class="text-danger">*</span></label>
          <select name="sex" class="form-select" required>
            <option value="">Choose...</option><option>Male</option><option>Female</option><option>Other</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Age <span class="text-danger">*</span></label>
          <input name="age" type="number" min="0" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Aadhar Number <span class="text-danger">*</span></label>
          <input name="aadhar_number" class="form-control" required pattern="\d{12}" placeholder="Enter 12-digit Aadhar">
          <div class="form-text">Must be a 12-digit number</div>
        </div>


        <div class="col-md-6">
          <label class="form-label">Father / Husband Name <span class="text-danger">*</span></label>
          <input name="father_or_husband" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Family - Huband/Wife <span class="text-danger">*</span></label>
          <input name="family_father" class="form-control" required>
          <div class="form-text">Kids names (comma separated)</div>
          <input name="family_kids" class="form-control mt-2" placeholder="e.g. Rahul, Priya">
        </div>

        <div class="col-md-6">
          <label class="form-label">Education <span class="text-danger">*</span></label>
          <input name="education" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Occupation <span class="text-danger">*</span></label>
          <input name="occupation" class="form-control" required>
        </div>

        <div class="col-12">
          <label class="form-label">Address <span class="text-danger">*</span></label>
          <textarea name="address" class="form-control" rows="2" required></textarea>
        </div>

        <div class="col-md-4">
          <label class="form-label">Intro <span class="text-danger">*</span></label>
          <select name="intro" class="form-select" required>
            <option value="">Choose...</option><option>Relation</option><option>Friend</option>
          </select>
        </div>

        <div class="col-md-8">
          <label class="form-label">Pledge Details <span class="text-danger">*</span></label>
          <input name="pledge_details" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Pledge Date <span class="text-danger">*</span></label>
          <input name="pledge_date" type="date" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Pledge Amounts <span class="text-danger">*</span></label>
          <input name="pledge_amounts" type="number" step="0.01" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Bill No <span class="text-danger">*</span></label>
          <input name="bill_no" class="form-control" required>
        </div>

    <!-- Repayment selection -->
<div class="col-md-4">
  <label class="form-label">Repayment <span class="text-danger">*</span></label>
  <select name="repayment" id="repayment" class="form-select" required>
    <option value="">Choose...</option>
    <option>Full</option>
    <option>Partial</option>
    <option>Nill</option>
  </select>
</div>

<!-- Repayment details and schedule -->
<div class="col-md-8" id="repayment-details-block" style="display:none;">
  <label class="form-label">Repayment Details (number of installments)</label>
  <div class="d-flex gap-2 align-items-start">
    <select name="repayment_details" id="repayment_details" class="form-select w-auto">
      <option value="">0</option>
      {% for i in range(1,10) %}
        <option value="{{i}}">{{i}}</option>
      {% endfor %}
    </select>
    <div id="repayment-schedule" class="flex-fill">
      <!-- schedule rows will be injected here as .row elements -->
    </div>
  </div>
  <div class="form-text mt-1">Choose number of installments; each will show Amount and Date fields.</div>
</div>


        <div class="col-md-8" id="repayment-details-block" style="display:none;">
          <label class="form-label">Repayment Details (0-9)</label>
          <div class="d-flex gap-2 align-items-center">
            <select name="repayment_details" id="repayment_details" class="form-select w-auto">
              <option value="">0</option>
              {% for i in range(1,10) %}
                <option value="{{i}}">{{i}}</option>
              {% endfor %}
            </select>
            <div id="repayment-schedule" class="flex-fill"></div>
          </div>
        </div>

        <div class="col-md-4">
          <label class="form-label">Total Grams pending <span class="text-danger">*</span></label>
          <input name="total_grams_pending" type="number" step="0.01" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Phone Number <span class="text-danger">*</span></label>
          <input name="phone_number" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Alternative Number</label>
          <input name="alt_number" class="form-control">
        </div>

        <div class="col-md-4">
          <label class="form-label">Return Jewellery</label>
          <input name="return_jewellary" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">Balance Jewellery</label>
          <input name="balance_jewellary" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">HC Claim Form Number</label>
          <input name="hc_claim_form_number" class="form-control">
        </div>

        <div class="col-12">
          <label class="form-label">Comments</label>
          <textarea name="comments" class="form-control" rows="2"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Remarks</label>
          <textarea name="remarks" class="form-control" rows="2"></textarea>
        </div>

        <div class="col-12 d-flex justify-content-between align-items-center">
          <div>
            <a class="btn btn-outline-secondary" href="{{ url_for('admin_login') }}">Admin</a>
            <a class="btn btn-outline-secondary ms-2" href="{{ url_for('admin_export') }}">Export (admin)</a>
          </div>
          <div>
            <button type="button" class="btn btn-secondary me-2" data-bs-toggle="modal" data-bs-target="#previewModal">Preview</button>
            <button type="submit" class="btn btn-primary">Submit Pledge</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Preview Modal -->
<div class="modal fade" id="previewModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Preview Submission</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="previewBody">
        <!-- filled by JS -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" id="confirmSubmit" class="btn btn-primary">Confirm & Submit</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
